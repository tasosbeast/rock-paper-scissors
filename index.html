<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <main class="game-shell">
      <section class="game-card">
        <p class="eyebrow">Classic Hand Game</p>
        <h1>Rock Paper Scissors</h1>

        <div class="results-panel" id="results">Make your move to start.</div>

        <div class="score-panel" aria-label="Current score">
          <div class="score-card">
            <span class="score-name">You</span>
            <span class="score-value" id="human-score">0</span>
          </div>
          <div class="score-card">
            <span class="score-name">Computer</span>
            <span class="score-value" id="computer-score">0</span>
          </div>
        </div>

        <div class="choice-grid" aria-label="Choose your move">
          <button class="choice-button" type="button" data-choice="rock">
            <span class="choice-icon">Rock</span>
            <span class="choice-label">Solid and stubborn</span>
          </button>
          <button class="choice-button" type="button" data-choice="paper">
            <span class="choice-icon">Paper</span>
            <span class="choice-label">Clever and precise</span>
          </button>
          <button class="choice-button" type="button" data-choice="scissors">
            <span class="choice-icon">Scissors</span>
            <span class="choice-label">Fast and sharp</span>
          </button>
        </div>

        <button class="restart-button" id="restart-button" type="button">
          Start New Game
        </button>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
